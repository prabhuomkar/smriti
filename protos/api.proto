syntax = "proto3";

import "google/protobuf/empty.proto";

option go_package = "api/";

message ConfigResponse {
  bytes config = 1;
}

enum MediaItemComponent {
  METADATA = 0;
  PREVIEW_THUMBNAIL = 1;
  PLACES = 2;
  FACES = 3;
  SEARCH = 4;
}

enum MediaItemStatus {
  UNSPECIFIED = 0;
  PROCESSING = 1;
  READY = 2;
  FAILED = 3;
}

enum MediaItemType {
  UNKNOWN = 0;
  PHOTO = 1;
  VIDEO = 2;
}

enum MediaItemCategory {
  DEFAULT = 0;
  SCREENSHOT = 1;
  PANORAMA = 2;
  SLOW = 3;
  MOTION = 4;
  LIVE = 5;
  TIMELAPSE = 6;
}

message MediaItemProcessResponse {
  string id = 1;
  string userId = 2;
  string mediaItemId = 3;
  repeated MediaItemComponent components = 4;
  map<string, string> payload = 5;
}

message MediaItemMetadataRequest {
  string userId = 1;
  string mediaItemId = 2;
  MediaItemStatus status = 3;
  optional string mimeType = 4;
  MediaItemType type = 5;
  MediaItemCategory category = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional string creationTime = 9;
  optional string cameraMake = 10;
  optional string cameraModel = 11;
  optional string focalLength = 12;
  optional string apertureFNumber = 13;
  optional string isoEquivalent = 14;
  optional string exposureTime = 15;
  optional string megapixels = 16;
  optional string fps = 17;
  optional double latitude = 18;
  optional double longitude = 19;
  optional string exifData = 20;
}

message MediaItemPreviewThumbnailRequest {
  string userId = 1;
  string mediaItemId = 2;
  MediaItemStatus status = 3;
  optional string sourcePath = 4;
  optional string previewPath = 5;
  optional string thumbnailPath = 6;
  optional string placeholder = 7;
}

message MediaItemPlaceRequest {
  string userId = 1;
  string mediaItemId = 2;
  optional string postcode = 3;
  optional string country = 4;
  optional string locality = 5; // city, town, village, municipality
  optional string area = 6;     // suburb, road, neighbourhood
}

message MediaItemEmbedding {
  repeated float embedding = 1;
}

message MediaItemFacesRequest {
  string userId = 1;
  string mediaItemId = 2;
  repeated MediaItemEmbedding embeddings = 3;
  repeated string thumbnails = 4;
}

message MediaItemFinalResultRequest {
  string id = 1;
  string userId = 2;
  string mediaItemId = 3;
  string detectedText = 4;
  string caption = 5;
  repeated MediaItemEmbedding embeddings = 6;
}

message MediaItemFaceEmbeddingsRequest {
  string userId = 1;
}

message MediaItemFaceEmbedding {
  string id = 1;
  string mediaItemId = 2;
  string peopleId = 3;
  MediaItemEmbedding embedding = 4;
}

message MediaItemFaceEmbeddingsResponse {
  repeated MediaItemFaceEmbedding mediaItemFaceEmbeddings = 1;
}

message UsersResponse {
  repeated string users = 1;
}

message MediaItemFacePeople {
  map<string, string> facePeople = 1;
}

message MediaItemPeopleRequest {
  string userId = 1;
  map<string, MediaItemFacePeople> mediaItemFacePeople = 2;
}

service API {
  rpc GetWorkerConfig(google.protobuf.Empty) returns (ConfigResponse) {}
  rpc GetMediaItemProcess(google.protobuf.Empty)
      returns (MediaItemProcessResponse) {}
  rpc GetMediaItemFaceEmbeddings(MediaItemFaceEmbeddingsRequest)
      returns (MediaItemFaceEmbeddingsResponse) {}
  rpc GetUsers(google.protobuf.Empty) returns (UsersResponse) {}
  rpc SaveMediaItemMetadata(MediaItemMetadataRequest)
      returns (google.protobuf.Empty) {}
  rpc SaveMediaItemPreviewThumbnail(MediaItemPreviewThumbnailRequest)
      returns (google.protobuf.Empty) {}
  rpc SaveMediaItemPlace(MediaItemPlaceRequest)
      returns (google.protobuf.Empty) {}
  rpc SaveMediaItemFaces(MediaItemFacesRequest)
      returns (google.protobuf.Empty) {}
  rpc SaveMediaItemPeople(MediaItemPeopleRequest)
      returns (google.protobuf.Empty) {}
  rpc SaveMediaItemFinalResult(MediaItemFinalResultRequest)
      returns (google.protobuf.Empty) {}
}
